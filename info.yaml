# Tiny Tapeout project information
project:
  title:        "Protocol Emulator"      # Project title
  author:       "Colin Jaworowski"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Programmable general-purpose protocol emulator targeting UART, SPI, and I2C."
  language:     "SystemVerilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # TODO: Set the operating frequency when the emulator RTL is defined.

  # Jane Street protocol emulator ASIC competition allocation (IHP CMOS5L).
  tiles: "6x4"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  # TODO: Rename alongside the RTL module and testbench when replacing the example.
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Operand A bit 0 (LSB)"
  ui[1]: "Operand A bit 1"
  ui[2]: "Operand A bit 2"
  ui[3]: "Operand A bit 3"
  ui[4]: "Operand A bit 4"
  ui[5]: "Operand A bit 5"
  ui[6]: "Operand A bit 6"
  ui[7]: "Operand A bit 7 (MSB)"

  # Outputs
  uo[0]: "Sum bit 0 (LSB)"
  uo[1]: "Sum bit 1"
  uo[2]: "Sum bit 2"
  uo[3]: "Sum bit 3"
  uo[4]: "Sum bit 4"
  uo[5]: "Sum bit 5"
  uo[6]: "Sum bit 6"
  uo[7]: "Sum bit 7 (carry discarded)"

  # Bidirectional pins
  uio[0]: "Operand B bit 0 (LSB, input)"
  uio[1]: "Operand B bit 1 (input)"
  uio[2]: "Operand B bit 2 (input)"
  uio[3]: "Operand B bit 3 (input)"
  uio[4]: "Operand B bit 4 (input)"
  uio[5]: "Operand B bit 5 (input)"
  uio[6]: "Operand B bit 6 (input)"
  uio[7]: "Operand B bit 7 (MSB, input)"

# Do not change!
yaml_version: 6
